<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" 
      xmlns:layout="http://ultraq.net.nz" 
      layout:decorate="~{admin/layouts/main-layout}">
<head>
    <title th:text="${cliente.id != null ? 'Editar Cliente - Admin' : 'Novo Cliente - Admin'}">Cliente - Admin</title>
</head>
<body>
    
    <main layout:fragment="content" class="gwj-p-4">
        
        <!-- Header / Breadcrumb -->
        <div class="gwj-d-flex gwj-justify-between gwj-align-center gwj-mb-4">
            <div>
                <h1 style="font-size: 1.8rem; margin: 0;" th:text="${cliente.id != null ? 'Editar Cliente #' + cliente.id : 'Cadastrar Novo Cliente'}">Novo Cliente</h1>
                <p style="color: var(--gwj-text-muted); margin: 0;">Dados cadastrais do cliente</p>
            </div>
            <a th:href="@{/MRYnZpAsC9sp/clientes}" class="gwj-btn gwj-btn-outline-secondary gwj-btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar à Lista
            </a>
        </div>

        <!-- Form Card -->
        <div class="gwj-card" style="max-width: 800px;">
            <div class="gwj-card-header">
                <h5 class="gwj-card-title">Informações do Cliente</h5>
            </div>
            <div class="gwj-card-body">
                <form th:action="@{/MRYnZpAsC9sp/clientes/salvar}" method="POST">
                    <input type="hidden" name="id" th:value="${cliente.id}">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="gwj-form-group">
                            <label class="gwj-label" for="nome">Nome *</label>
                            <input type="text" id="nome" name="nome" class="gwj-input" th:value="${cliente.nome}" required placeholder="Nome">
                        </div>
                        <div class="gwj-form-group">
                            <label class="gwj-label" for="sobrenome">Sobrenome</label>
                            <input type="text" id="sobrenome" name="sobrenome" class="gwj-input" th:value="${cliente.sobrenome}" placeholder="Sobrenome">
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="gwj-form-group">
                            <label class="gwj-label" for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" class="gwj-input" th:value="${cliente.cpf}" placeholder="000.000.000-00">
                        </div>
                        <div class="gwj-form-group">
                            <label class="gwj-label" for="telefone">Telefone / WhatsApp</label>
                            <input type="text" id="telefone" name="telefone" class="gwj-input" th:value="${cliente.telefone}" placeholder="(11) 99999-9999">
                        </div>
                    </div>

                    <div class="gwj-d-flex gwj-justify-end gwj-gap-2 gwj-mt-4">
                        <a th:href="@{/MRYnZpAsC9sp/clientes}" class="gwj-btn gwj-btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="gwj-btn gwj-btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar Cliente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
