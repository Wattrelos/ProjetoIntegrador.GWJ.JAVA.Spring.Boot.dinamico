<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" 
      xmlns:layout="http://ultraq.net.nz" 
      layout:decorate="~{admin/layouts/main-layout}">
<head>
    <title>Gestão de Profissionais - Admin</title>
</head>
<body>
    
    <main layout:fragment="content" class="gwj-p-4">
        
        <!-- Header / Ações -->
        <div class="gwj-d-flex gwj-justify-between gwj-align-center gwj-mb-4">
            <div>
                <h1 style="font-size: 1.8rem; margin: 0;">Gestão de Profissionais</h1>
                <p style="color: var(--gwj-text-muted); margin: 0;">Barbeiros e profissionais que atendem na barbearia</p>
            </div>
            <div class="gwj-d-flex gwj-gap-2">
                <a th:href="@{/MRYnZpAsC9sp/}" class="gwj-btn gwj-btn-outline-secondary gwj-btn-sm">
                    <i class="bi bi-arrow-left"></i> Painel
                </a>
                <a th:href="@{/MRYnZpAsC9sp/profissionais/novo}" class="gwj-btn gwj-btn-primary gwj-btn-sm">
                    <i class="bi bi-plus-lg"></i> Novo Profissional
                </a>
            </div>
        </div>

        <!-- Tabela Card -->
        <div class="gwj-card">
            <div class="gwj-card-header gwj-d-flex gwj-justify-between gwj-align-center">
                <h5 class="gwj-card-title">Lista de Profissionais</h5>
                <span class="gwj-badge gwj-badge-info" th:text="${profissionais != null ? profissionais.size() + ' profissional(is)' : '0 profissionais'}">0 profissionais</span>
            </div>
            <div class="gwj-card-body gwj-p-0">
                <div class="gwj-table-responsive">
                    <table class="gwj-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>Status</th>
                                <th class="gwj-text-end" style="width: 160px; padding-right: 2rem;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="gwj-table-row" th:each="prof : ${profissionais}">
                                <td th:text="'#' + ${prof.id}">#1</td>
                                <td>
                                    <div class="gwj-d-flex gwj-align-center gwj-gap-2">
                                        <i class="bi bi-person-badge" style="font-size: 1.4rem; color: var(--gwj-primary-color);"></i>
                                        <span style="font-weight: 600; color: var(--gwj-text-dark);" th:text="${prof.nome}">Thiago Silva</span>
                                    </div>
                                </td>
                                <td th:text="${prof.email != null ? prof.email : '—'}">thiago@tgos.com</td>
                                <td th:text="${prof.telefone != null ? prof.telefone : '—'}">(11) 98888-8888</td>
                                <td>
                                    <span th:if="${prof.status}" class="gwj-badge gwj-badge-success">Ativo</span>
                                    <span th:unless="${prof.status}" class="gwj-badge gwj-badge-danger">Inativo</span>
                                </td>
                                <td class="gwj-text-end" style="padding-right: 2rem;">
                                    <a th:href="@{/MRYnZpAsC9sp/profissionais/editar/{id}(id=${prof.id})}" 
                                       class="gwj-btn gwj-btn-outline-primary gwj-btn-sm" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/MRYnZpAsC9sp/profissionais/excluir/{id}(id=${prof.id})}" 
                                       onclick="return confirm('Deseja realmente excluir este profissional?');"
                                       class="gwj-btn gwj-btn-outline-danger gwj-btn-sm" title="Excluir">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${profissionais == null or #lists.isEmpty(profissionais)}">
                                <td colspan="6" class="gwj-text-center gwj-p-4" style="color: var(--gwj-text-muted);">
                                    Nenhum profissional cadastrado até o momento.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
