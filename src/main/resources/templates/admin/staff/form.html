<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" 
      xmlns:layout="http://ultraq.net.nz" 
      layout:decorate="~{admin/layouts/main-layout}">
<head>
    <title th:text="${profissional.id != null ? 'Editar Profissional - Admin' : 'Novo Profissional - Admin'}">Profissional - Admin</title>
</head>
<body>
    
    <main layout:fragment="content" class="gwj-p-4">
        
        <!-- Header / Breadcrumb -->
        <div class="gwj-d-flex gwj-justify-between gwj-align-center gwj-mb-4">
            <div>
                <h1 style="font-size: 1.8rem; margin: 0;" th:text="${profissional.id != null ? 'Editar Profissional #' + profissional.id : 'Cadastrar Novo Profissional'}">Novo Profissional</h1>
                <p style="color: var(--gwj-text-muted); margin: 0;">Preencha os dados do barbeiro ou funcionário</p>
            </div>
            <a th:href="@{/MRYnZpAsC9sp/profissionais}" class="gwj-btn gwj-btn-outline-secondary gwj-btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar à Lista
            </a>
        </div>

        <!-- Form Card -->
        <div class="gwj-card" style="max-width: 800px;">
            <div class="gwj-card-header">
                <h5 class="gwj-card-title">Informações do Profissional</h5>
            </div>
            <div class="gwj-card-body">
                <form th:action="@{/MRYnZpAsC9sp/profissionais/salvar}" method="POST">
                    <input type="hidden" name="id" th:value="${profissional.id}">

                    <div class="gwj-form-group">
                        <label class="gwj-label" for="nome">Nome Completo *</label>
                        <input type="text" id="nome" name="nome" class="gwj-input" th:value="${profissional.nome}" required placeholder="Ex: Thiago Ramos">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="gwj-form-group">
                            <label class="gwj-label" for="email">E-mail</label>
                            <input type="email" id="email" name="email" class="gwj-input" th:value="${profissional.email}" placeholder="barbeiro@tgos.com">
                        </div>
                        <div class="gwj-form-group">
                            <label class="gwj-label" for="telefone">Telefone / WhatsApp</label>
                            <input type="text" id="telefone" name="telefone" class="gwj-input" th:value="${profissional.telefone}" placeholder="(11) 98888-8888">
                        </div>
                    </div>

                    <div class="gwj-form-group" style="margin-top: 1rem;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" name="status" value="true" th:checked="${profissional.status == null || profissional.status}">
                            <span style="font-weight: 600; color: var(--gwj-text-dark);">Profissional Ativo (disponível na escala de agendamentos)</span>
                        </label>
                    </div>

                    <div class="gwj-d-flex gwj-justify-end gwj-gap-2 gwj-mt-4">
                        <a th:href="@{/MRYnZpAsC9sp/profissionais}" class="gwj-btn gwj-btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="gwj-btn gwj-btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar Profissional
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
