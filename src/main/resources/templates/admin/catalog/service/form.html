<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" 
      xmlns:layout="http://ultraq.net.nz" 
      layout:decorate="~{admin/layouts/main-layout}">
<head>
    <title th:text="${servico.id != null ? 'Editar Serviço - Admin' : 'Novo Serviço - Admin'}">Serviço - Admin</title>
</head>
<body>
    
    <main layout:fragment="content" class="gwj-p-4">
        
        <!-- Header / Breadcrumb -->
        <div class="gwj-d-flex gwj-justify-between gwj-align-center gwj-mb-4">
            <div>
                <h1 style="font-size: 1.8rem; margin: 0;" th:text="${servico.id != null ? 'Editar Serviço #' + servico.id : 'Cadastrar Novo Serviço'}">Novo Serviço</h1>
                <p style="color: var(--gwj-text-muted); margin: 0;">Preencha os dados do serviço oferecido aos clientes</p>
            </div>
            <a th:href="@{/MRYnZpAsC9sp/servicos}" class="gwj-btn gwj-btn-outline-secondary gwj-btn-sm">
                <i class="bi bi-arrow-left"></i> Voltar à Lista
            </a>
        </div>

        <!-- Form Card -->
        <div class="gwj-card" style="max-width: 800px;">
            <div class="gwj-card-header">
                <h5 class="gwj-card-title">Informações do Serviço</h5>
            </div>
            <div class="gwj-card-body">
                <form th:action="@{/MRYnZpAsC9sp/servicos/salvar}" method="POST">
                    <input type="hidden" name="id" th:value="${servico.id}">

                    <div class="gwj-form-group">
                        <label class="gwj-label" for="nome">Nome do Serviço *</label>
                        <input type="text" id="nome" name="nome" class="gwj-input" th:value="${servico.nome}" required placeholder="Ex: Corte Degradê + Barboterapia">
                    </div>

                    <div class="gwj-form-group">
                        <label class="gwj-label" for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" class="gwj-input" rows="3" th:text="${servico.descricao}" placeholder="Descrição detalhada do que está incluso no serviço..."></textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="gwj-form-group">
                            <label class="gwj-label" for="preco">Preço (R$) *</label>
                            <input type="number" step="0.01" id="preco" name="preco" class="gwj-input" th:value="${servico.preco}" required placeholder="0.00">
                        </div>
                        <div class="gwj-form-group">
                            <label class="gwj-label" for="duracao">Duração Estimada (minutos)</label>
                            <input type="number" id="duracao" name="duracao" class="gwj-input" th:value="${servico.duracao != null ? servico.duracao : 30}" placeholder="30">
                        </div>
                    </div>

                    <div class="gwj-form-group">
                        <label class="gwj-label" for="imagem">URL da Imagem / Foto</label>
                        <input type="text" id="imagem" name="imagem" class="gwj-input" th:value="${servico.imagem}" placeholder="https://exemplo.com/servico.png ou /img/corte.png">
                    </div>

                    <div class="gwj-form-group" style="margin-top: 1rem;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" name="ativo" value="true" th:checked="${servico.ativo == null || servico.ativo}">
                            <span style="font-weight: 600; color: var(--gwj-text-dark);">Serviço Ativo (disponível para agendamento)</span>
                        </label>
                    </div>

                    <div class="gwj-d-flex gwj-justify-end gwj-gap-2 gwj-mt-4">
                        <a th:href="@{/MRYnZpAsC9sp/servicos}" class="gwj-btn gwj-btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="gwj-btn gwj-btn-primary">
                            <i class="bi bi-check-lg"></i> Salvar Serviço
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
